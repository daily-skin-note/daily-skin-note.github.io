<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肌管理</title>
<link rel="apple-touch-icon" href="assets/20260921_apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/20260921_icon-512.png">
<meta name="apple-mobile-web-app-title" content="肌管理">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 臨床寄り：白と冷たいグレーを土台に、ローズは1色だけ差す */
  /* 指定のピンク6色 */
  --rose-water:#ffecef; --rose-pearl:#ffe0e9; --rose-crystal:#ffd6e0;
  --rose-grad:#ffccd5;  --rose-blossom:#ffc9d4; --rose-silky:#ffb5c5;

  --bg:#ffffff; --surface:#ffffff; --surface-2:var(--rose-water);
  --text:#2a2024; --text-sub:#6f6166; --text-weak:#6f6166;
  --line:#f0dfe4;
  --accent:#b0485c;              /* 上の6色は淡いので、文字と線だけ同じ色相の濃い版を使う */
  --accent-fill:var(--rose-silky);   /* ボタンの塗りは シルキーピンク */
  --accent-on-fill:#6e2b3a;          /* その上に乗る文字 */
  --accent-weak:var(--rose-pearl);
  --sleep:#d3d8e2; --period:var(--rose-crystal);
  --s0:#f1eeef;                  /* 記録なしの日はグレー（ピンクと区別するため） */
  --s1:var(--rose-water); --s2:var(--rose-pearl); --s3:var(--rose-crystal);
  --s4:var(--rose-grad); --s5:var(--rose-silky);
  --on-s45:var(--text);          /* 5段階すべて淡いので、文字は濃いまま */
  --shadow:0 1px 2px rgba(60,30,40,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191416; --surface:#221c1f; --surface-2:#2b2328;
    --text:#f4ecee; --text-sub:#b5a7ac; --text-weak:#b5a7ac;
    --line:#352b30; --accent:#ffb5c5; --accent-fill:#8a4256; --accent-on-fill:#ffecef;
    --accent-weak:#3d2a31;
    --sleep:#3c414c; --period:#4a2f38;
    --s0:#2b2328; --s1:#3b2a30; --s2:#54383f; --s3:#7a4f5b; --s4:#a97180; --s5:#e3a3b1;
    --on-s45:#1d1719; --shadow:0 1px 2px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#191416; --surface:#221c1f; --surface-2:#2b2328;
  --text:#f4ecee; --text-sub:#b5a7ac; --text-weak:#b5a7ac;
  --line:#352b30; --accent:#ffb5c5; --accent-fill:#8a4256; --accent-on-fill:#ffecef;
  --accent-weak:#3d2a31;
  --sleep:#3c414c; --period:#4a2f38;
  --s0:#2b2328; --s1:#3b2a30; --s2:#54383f; --s3:#7a4f5b; --s4:#a97180; --s5:#e3a3b1;
  --on-s45:#1d1719; --shadow:0 1px 2px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP",system-ui,sans-serif;
  font-size:17px;            /* HIG: iOSの本文の既定は17pt */
  line-height:1.6;
  /* HIG: セーフエリアを避ける。下はタブバー＋ホームインジケータ分 */
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
/* HIG: 動きを減らす設定を尊重する */
@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
  .sheet{transition:opacity .15s !important}
}
.num{font-family:"Inter",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:430px;margin:0 auto;padding:0 16px;
  padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right))}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
.head{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:6px 0}
.head h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.06em}
.head .today{font-size:13px;color:var(--text-sub);margin-left:8px;font-weight:400}
.icon-btn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--accent);margin-right:-10px}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:active{opacity:.4}

/* tabs */
/* HIG: 上位の画面切り替えは画面下のタブバー。アイコン＋ラベル・常に表示 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tab{flex:1;min-height:50px;padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--text-sub);font-size:11px;font-weight:500}
.tabbar .tab svg{width:26px;height:26px}
.tabbar .tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tabbar .tab:active{opacity:.5}

/* calendar */
.月nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0 12px}
.月nav .label{font-size:17px;font-weight:600;min-width:120px;text-align:center;letter-spacing:.04em}
.nav-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text-sub);background:var(--surface)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow div{text-align:center;font-size:12px;color:var(--text-weak)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{aspect-ratio:1/1;min-height:44px;border-radius:10px;background:var(--s0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;font-size:15px}
.cell:active{opacity:.6}
.cell.empty{background:none}
.cell .d{font-family:"Inter";font-weight:500}
.cell.today{outline:2px solid var(--accent);outline-offset:1px}
.cell .good{position:absolute;top:3px;right:5px;font-size:10px;line-height:1;color:var(--accent)}
.good-mark{color:var(--accent)}
.streaks .streak{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.streaks .streak b{font-family:"Inter";font-size:20px;font-weight:600;color:var(--accent)}
.streaks .streak small{font-size:12px;font-weight:400;color:var(--text-sub);margin-left:2px}
.foods.avoid{grid-template-columns:repeat(4,1fr)}
.foods.avoid .food span{font-size:11px;text-align:center;line-height:1.25;padding:0 2px}
.foods.avoid .food{aspect-ratio:auto;min-height:84px;padding:6px 0}
.none-chip{margin-top:8px}
.good-chip{cursor:default;background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.chip .ic{width:1.3em;height:1.3em;margin-right:4px}
.cell .photo{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.legend{display:flex;align-items:center;gap:6px;justify-content:center;padding:14px 0 4px;font-size:12px;color:var(--text-sub)}
.legend i{width:16px;height:10px;border-radius:3px;display:block}
.summary{display:flex;flex-wrap:wrap;gap:8px;padding:12px 0 0}
.stat{flex:1 1 calc(33.333% - 6px);min-width:96px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.stat .k{font-size:12px;color:var(--text-sub);letter-spacing:.04em}
.stat .v{font-family:"Inter";font-size:22px;font-weight:600;line-height:1.3}
.stat .v small{font-size:12px;color:var(--text-sub);font-weight:400;margin-left:2px}
.cta{width:100%;min-height:50px;margin-top:16px;background:var(--accent-fill);color:var(--accent-on-fill);
  border:1px solid rgba(0,0,0,.04);border-radius:12px;padding:14px;font-weight:700;font-size:17px;letter-spacing:.02em}
.cta:active{opacity:.75}
.backup-note{display:block;width:100%;min-height:44px;margin:0 0 12px;padding:10px 14px;text-align:left;font-size:14px;color:var(--accent-on-fill);background:var(--rose-pearl);border-radius:12px}
.backup-note:active{opacity:.75}

/* graph */
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;margin:4px 0 12px}
.seg button{min-height:34px;padding:5px 16px;border-radius:7px;font-size:14px;color:var(--text-sub)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 14px;margin-bottom:10px}
.card h3{margin:0 0 3px;font-size:16px;font-weight:700;letter-spacing:.01em}
.card p.sub{margin:0 0 8px;font-size:13px;color:var(--text-sub)}
svg{display:block;width:100%;height:auto}
.gkey{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-sub);padding-top:6px}
.gkey span{display:flex;align-items:center;gap:4px}
.gkey i{width:12px;height:3px;border-radius:2px;display:block}

/* items */
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .name{flex:1;min-width:0}
.item .name b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .name span{font-size:13px;color:var(--text-sub)}
.item .avg{font-family:"Inter";font-size:19px;font-weight:600;width:42px;text-align:right}
.item .bar{width:56px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.item .bar i{display:block;height:100%;background:var(--rose-silky);border-radius:3px}
.item.off{opacity:.45}
.item{width:100%;text-align:left}
.item .ings{display:block;font-size:12px;color:var(--text-weak);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{padding:10px 0 4px;border-top:1px solid var(--line);margin-top:10px}
.rec:first-of-type{border-top:none;margin-top:4px}
.rec-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:15px}
.rec-head b{font-weight:700}
.rec-head span{font-size:12px;color:var(--text-sub);margin-left:auto}
.chip.ing{display:flex;align-items:center;gap:6px;color:var(--text-sub);cursor:default}
.chip.ing em{font-style:normal;font-size:12px;color:var(--text-sub)}
.chip.ing.have{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip.ing.have em{color:var(--accent)}
.chip.ing.off{opacity:.6;text-decoration:line-through}
.rec.warn .rec-head b{color:var(--text-sub)}
.goal{padding:10px 0 4px;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:none}
.goal-head{margin-bottom:2px;font-size:15px}
.goal-head b{display:block}
.goal-head span{display:block;margin-top:1px;font-size:12px;color:var(--text-weak)}
.goal-none{font-size:13px;color:var(--text-weak);padding:6px 0 8px}
.goal-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:6px 0;text-align:left;border-radius:8px}
.goal-item:active{background:var(--surface-2)}
.goal-item b{font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal-item span{flex:none;max-width:52%;font-size:13px;color:var(--accent);text-align:right}
.ic{display:inline-block;width:1.4em;height:1.4em;vertical-align:-.32em;margin-right:5px;flex:none}
.ic svg{display:block;width:100%;height:100%}
.sub-label .ic{width:1.6em;height:1.6em;vertical-align:-.45em}
.goal-head b .ic{width:1.5em;height:1.5em;vertical-align:-.42em}
.check .ic{width:30px;height:30px;margin-right:0;vertical-align:baseline}
.item .ings .ig{display:inline-block;margin-right:8px;white-space:nowrap}
.item .ings .ic{width:1.25em;height:1.25em;margin-right:3px;vertical-align:-.28em}
.ing-row{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.ing-row:last-child{border-bottom:none}
.ing-row .check{flex:1;border-bottom:none;min-width:0}
.star{flex:none;width:48px;min-height:44px;font-size:20px;color:var(--line);border-left:1px solid var(--line)}
.star[aria-pressed="true"]{color:var(--accent)}
.star:disabled{opacity:.35}
.star:not(:disabled):active{background:var(--surface-2)}
.key{font-style:normal;color:var(--accent);margin-right:2px}
.ing-edit{flex:none;min-width:52px;min-height:44px;font-size:14px;color:var(--accent);border-left:1px solid var(--line)}
.ing-edit:active{background:var(--surface-2)}
.add-ing .chip .ic{width:1.3em;height:1.3em;margin-right:4px}
.ing-name small.fam{color:var(--text-weak)}
.add-ing{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.add-ing .sub-label{margin:10px 0 6px}
.ing-name{display:flex;flex-direction:column;gap:1px;text-align:left}
.ing-name b{font-size:15px;font-weight:500}
.ing-name small{font-size:12px;color:var(--text-sub)}
.add{width:100%;min-height:44px;margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--accent)}
.add:active{opacity:.5}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(30,20,24,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:30}
.mask.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:18px 18px 0 0;
  max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;box-shadow:var(--shadow)}
.sheet.open{transform:translateY(0)}
.sheet-in{max-width:430px;margin:0 auto;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 4px}
.sheet-head{position:sticky;top:0;background:var(--bg);display:grid;grid-template-columns:auto 1fr auto;
  align-items:center;gap:10px;padding:6px 0 10px;z-index:2;border-bottom:1px solid var(--line);margin-bottom:14px}
.sheet-head h2{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .close{justify-self:start}
.sheet-head .done{justify-self:end;min-height:44px;min-width:44px;justify-content:flex-end;display:flex;align-items:center;
  font-size:17px;font-weight:700;color:var(--accent)}
.sheet-head .done:active{opacity:.4}
.sheet-head h2{margin:0;font-size:17px;font-weight:700}
.sheet-head .close{min-height:44px;min-width:44px;justify-content:flex-start;display:flex;align-items:center;font-size:17px;color:var(--accent);white-space:nowrap}
.sheet-head .done{white-space:nowrap}
.sheet-head h2{font-size:16px}
.sheet-head .close:active{opacity:.4}
.field{margin-bottom:18px}
.field > label{display:block;font-size:12px;font-weight:700;color:var(--text-sub);margin-bottom:8px;letter-spacing:.06em}
.field > label em{font-style:normal;font-weight:400;color:var(--text-sub);margin-left:4px;font-size:12px}
.scores{display:flex;gap:6px}
.scores button{flex:1;aspect-ratio:1/1;min-height:44px;border-radius:11px;background:var(--surface-2);font-family:"Inter";font-size:19px;font-weight:600;color:var(--text-sub);border:1px solid var(--line)}
.scores button{background:var(--surface)}
.scores button[aria-pressed="true"]{color:var(--text);border:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.routine{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.routine-row{display:grid;grid-template-columns:5.2em 1fr;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.routine-row:last-child{border-bottom:none}
.routine-row .rt{font-size:12px;color:var(--text-sub);line-height:1.3}
.routine-row .chips{gap:6px}
.rchip{padding:0 12px;font-size:14px}
.rchip .tick{margin-right:4px;font-weight:700}
.routine-label{display:flex;justify-content:space-between;align-items:baseline}
.routine-label .num{font-size:12px;color:var(--accent)}
.chip{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--text-sub)}
.chip:active{opacity:.5}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:500}
input[type=text],textarea{width:100%;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:17px;color:var(--text);resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.stepper{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:20px;display:grid;place-items:center}
.stepper button:active{background:var(--line)}
.stepper .val{flex:1;text-align:center;font-family:"Inter";font-size:22px;font-weight:600}
.stepper .wt{width:5.6em;min-height:44px;padding:0;border:none;background:transparent;text-align:center;font-family:"Inter";font-size:22px;font-weight:600;color:var(--text)}
.stepper .wt:focus{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.stepper .val small{font-size:13px;color:var(--text-sub);font-weight:400}
.checks{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.check{display:flex;width:100%;text-align:left;align-items:center;gap:10px;min-height:44px;padding:11px 13px;border-bottom:1px solid var(--line);font-size:14px}
.check:last-child{border-bottom:none}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:12px}
.check[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.check .cat{margin-left:auto;font-size:12px;color:var(--text-sub)}
.field > label{display:flex;align-items:center}
.field > label .count{margin-left:auto;font-weight:600;color:var(--accent)}
.foods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.food{aspect-ratio:1/1;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-sub)}
.food .fi{display:block;width:37px;height:37px;opacity:.6;filter:saturate(.55)}
.food .fi svg{display:block;width:100%;height:100%}
.food span{font-size:11px}
.food[aria-pressed="true"] .fi{opacity:1;filter:none}
.food[aria-pressed="true"]{background:var(--rose-silky);border-color:var(--accent);color:var(--accent-on-fill)}
.hint{font-size:13px;color:var(--text-weak);margin:7px 0 0;line-height:1.6}
.clear{width:100%;min-height:44px;text-align:center;font-size:16px;color:var(--accent);padding:9px 0 0}
.sub-label .note{font-weight:400;color:var(--text-weak)}
.sub-label{font-size:13px;color:var(--text-sub);margin:0 0 5px;font-weight:500}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photos:last-of-type{margin-bottom:0}
.photo-slot{aspect-ratio:3/4;min-height:44px;border:1px dashed var(--line);border-radius:9px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text-sub);font-size:13px}
.photo-slot:active{opacity:.5}
.photo-slot{position:relative;overflow:hidden}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot .lbl{position:relative;z-index:1}
.photo-slot.has img~.lbl,.photo-slot.has img~.ic{background:color-mix(in srgb,var(--bg) 82%,transparent);padding:1px 8px;border-radius:8px}
.photo-box{position:relative;overflow:hidden}
.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;color:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam-guide{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transform:translateY(-4vh)}
.cam-guide i{position:relative;width:min(72vw,calc(58vh*.75));aspect-ratio:3/4;border:3px solid rgba(255,255,255,.92);border-radius:50%;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.cam-guide i::after{content:"";position:absolute;left:12%;right:12%;top:42%;border-top:2px dashed rgba(255,255,255,.65)}
.cam-top{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 20px 14px;text-align:center;background:linear-gradient(rgba(0,0,0,.55),transparent)}
.cam-top b{display:block;font-size:17px}
.cam-top span{font-size:14px;opacity:.9}
.cam-msg{position:absolute;left:24px;right:24px;top:40%;text-align:center;font-size:16px;line-height:1.6}
.cam-bar{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cam-bar button{min-height:44px;color:#fff;font-size:16px}
.cam-x{justify-self:start}.cam-pick{justify-self:end;text-align:right}
.cam-bar button:active{opacity:.55}
.cam-shot{width:72px;height:72px;min-height:72px!important;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.55);background-clip:padding-box}
.cam-shot:disabled{opacity:.35}
.loading{position:relative}
.photo-slot.loading::after,.photo-box.loading::after{content:"取得中";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:11px;color:var(--text-sub);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:1px 8px;border-radius:8px}
.thumb{flex:none;width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface-2)}
.ing-paste{width:100%;min-height:72px;margin:8px 0;padding:10px 12px;font:inherit;font-size:16px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;resize:vertical}
.photo-slot .ic{font-size:20px}
.photo-slot.has{border-style:solid;border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.photo-box{height:120px;border:1px dashed var(--line);border-radius:10px;display:grid;place-items:center;background:var(--surface);color:var(--accent);font-size:16px;width:100%}
.photo-box:active{opacity:.5}
.save{width:100%;min-height:50px;background:var(--accent-fill);color:var(--accent-on-fill);border-radius:12px;padding:15px;font-weight:700;font-size:17px}
.save:active{opacity:.75}
.meta{font-size:13px;color:var(--text-sub);text-align:center;margin-top:10px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:13px;border-bottom:1px solid var(--line);font-size:16px;text-align:left}
button.row:active{background:var(--surface-2)}
.row:last-child{border-bottom:none}
.ok{color:var(--accent)}
.tc-head{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 2px;font-size:14px}
.tc-head span{font-size:13px;color:var(--text-sub)}
.time-row{justify-content:space-between}
.time-row input{font:inherit;font-size:17px;font-family:"Inter";color:var(--text);background:transparent;border:none;text-align:right;min-height:44px}
.row .arw{margin-left:auto;color:var(--text-weak)}
.row.danger{color:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row.danger{color:#ff8a7a}}
:root[data-theme="dark"] .row.danger{color:#ff8a7a}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,16px);background:var(--text);color:var(--bg);
  padding:11px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mocknote{font-size:12px;color:var(--text-weak);text-align:center;padding:18px 0 4px}
</style>
</head>

<div class="mask" id="mask"></div>

<div class="sheet" id="sheetLog"><div class="sheet-in">
  <div class="grab"></div>
  <div class="sheet-head">

  </div>
  <div id="logBody"></div>
</div></div>

<div class="sheet" id="sheetItem"><div class="sheet-in">

  </div>
  <div id="itemBody"></div>
</div></div>

<div class="sheet" id="sheetSet"><div class="sheet-in">

    <span></span>

    <button class="done" data-close>完了</button>
  </div>
  <div class="field">
    <label>データ</label>
    <div class="rows">

      <button class="row" id="btnImport">JSONを読み込む<span class="arw">›</span></button>

    </div>

  </div>
  <div class="field">
    <label>生理周期</label>
    <div class="rows" id="periodRows"></div>
  </div>
  <div class="field">
    <label>表示</label>
    <div class="rows">

  </div>
  <div class="field">
    <div class="rows"><button class="row danger" id="btnReset">すべての記録を消す</button></div>
  </div>
</div></div>

const vNum  = (n, lo, hi) => typeof n === 'number' && isFinite(n) && n >= lo && n <= hi ? n : null;
const vStrs = (a, max=100) => Array.isArray(a) ? a.filter(x => typeof x === 'string').slice(0, max) : [];
const vPick = (s, list) => list.includes(s) ? s : null;
function migrate(d){
  const out = blankData();
  if(!d || typeof d !== 'object') return out;
  if(Array.isArray(d.items)) out.items = d.items.filter(i=>i && typeof i === 'object')
    .map(i=>({id:vStr(i.id,64), name:vStr(i.name,200), category:vStr(i.category,50), active:i.active!==false, ingredients:vStrs(i.ingredients), keyIngredients:vStrs(i.keyIngredients).filter(k=>Array.isArray(i.ingredients) && i.ingredients.includes(k)), photo:vStr(i.photo,80)||null}));
  // 成分マスタは、組み込みの一覧をコードから作り直す（一覧を変えても古い端末で古いまま残らない）。
  // 保存データからは、自分で足した成分と、一覧から外れたがアイテムが使っている成分だけを引き継ぐ
  if(Array.isArray(d.ingredients)){
    const have = new Set(out.ingredients.map(g=>g.k)), used = new Set(out.items.flatMap(i=>i.ingredients));
    d.ingredients.filter(g=>g && typeof g === 'object' && typeof g.k === 'string' && !have.has(g.k) && (g.k.startsWith('c_') || used.has(g.k)))
      .forEach(g=>{ have.add(g.k); const gs = vStrs(g.genres,10).filter(x=>GENRES.includes(x)); if(!gs.length && GENRES.includes(g.cat)) gs.push(g.cat);
        out.ingredients.push({k:vStr(g.k,64), n:vStr(g.n,200)||vStr(g.k,64), genres:gs, family:null, icon:'', purpose:vStr(g.purpose,100), for:vStrs(g.for,20), avoid:vStrs(g.avoid,20)}); });
  }
  if(Array.isArray(d.periods)) out.periods = d.periods.filter(p=>p && vDate(p.start))
    .map(p=>({start:vDate(p.start), end:vDate(p.end)})).sort((a,b)=>a.start<b.start?-1:1);
  if(d.logs && typeof d.logs === 'object'){
    // 項目が欠けた記録（古い形・手で直したJSON）も、画面が落ちないよう既定値で補う。
    // 日付の形をしたキーだけを通す（細工したキーはここで落ちる）
    for(const [k,l] of Object.entries(d.logs)){
      if(!RE_DATE.test(k) || !l || typeof l !== 'object') continue;
      const photos = {};
      if(l.photos && typeof l.photos === 'object')
        for(const [pk,pv] of Object.entries(l.photos)) if(/^(bare|makeup)_(front|left|right)$/.test(pk) && typeof pv === 'string') photos[pk] = vStr(pv,80);
      out.logs[k] = {
        score: vNum(l.score,1,5) ? Math.round(vNum(l.score,1,5)) : null,
        conditions: vStrs(l.conditions,20), areaMemo: vStr(l.areaMemo),
        // itemIds は「その日に使ったアイテム全部」（朝・夜・時間帯なしの合計）。平均スコアなどはこれで数える
        itemIdsAM: vStrs(l.itemIdsAM), itemIdsPM: vStrs(l.itemIdsPM),
        itemIds: [...new Set([...vStrs(l.itemIds), ...vStrs(l.itemIdsAM), ...vStrs(l.itemIdsPM)])],
        bedTime: vTime(l.bedTime), wakeTime: vTime(l.wakeTime),
        sleepHours: vNum(l.sleepHours,0,24),
        mealStart: vTime(l.mealStart), mealEnd: vTime(l.mealEnd),
        water: vNum(l.water,0,100) ?? 0,
        poop: vPick(l.poop, ['yes','no']), bath: vPick(l.bath, ['tub','shower','none']), makeup: vPick(l.makeup, ['yes','no']),
        foods: vStrs(l.foods,10), weight: vNum(l.weight,0,500),
        avoidFoods: Array.isArray(l.avoidFoods) ? vStrs(l.avoidFoods,10).filter(k=>AVOID_FOODS.some(a=>a.k===k)) : null,
        supplements: vStrs(l.supplements,20),
        lifeTags: vStrs(l.lifeTags,20), memo: vStr(l.memo), photos
      };
    }
  }
  return out;
}
let loadFailed = false;
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){ loadFailed = true; return blankData(); }
  if(!raw) return blankData();
  try{ return migrate(JSON.parse(raw)); }
  catch(e){
    // 読めないデータは上書きしない。別の名前で残しておく
    try{ localStorage.setItem(STORE_KEY+'_broken', raw); }catch(_){}
    loadFailed = true; return blankData();
  }
}
const DB = load();
// バックアップの日付は書き出しファイルに入れないよう、別のキーに持つ
const META_KEY = STORE_KEY+'_meta', DAY_MS = 86400000, BACKUP_DAYS = 30;
const loadMeta = ()=>{ try{ return JSON.parse(localStorage.getItem(META_KEY)) || {}; }catch(_){ return {}; } };
const saveMeta = m => { try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(_){} };
// null = 声かけ不要／文字 = 出す文言
function backupNotice(){
  if(!Object.keys(DB.logs).length) return null;
  const m = loadMeta();
  if(!m.since){ m.since = TODAY; saveMeta(m); }
  const base = m.lastExport || m.since;
  const days = Math.floor((parse(TODAY)-parse(base))/DAY_MS);
  if(days < BACKUP_DAYS) return null;
  return m.lastExport ? `バックアップから${days}日たちました。書き出しておきませんか` : `まだバックアップがありません。書き出しておきませんか`;
}
const INGREDIENTS = DB.ingredients, ITEMS = DB.items, PERIODS = DB.periods, LOGS = DB.logs;
function save(){
  if(loadFailed){ toast('読み込みに失敗したので、保存を止めています'); return false; }
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); if(typeof driveSoon==='function') driveSoon(); return true; }
  catch(e){ toast('保存できませんでした（容量かブラウザの設定）'); return false; }
}


/* ============ 共通 ============ */
const $  = s => document.querySelector(s);
const el = (tag, cls, html) => { const n=document.createElement(tag); if(cls)n.className=cls; if(html!=null)n.innerHTML=html; return n; };
// 画面に文字として出すための無害化。HTMLの記号を打ち消す（読み込んだJSONの値を出すときは必ず通す）
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = msg => { const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); };
const fmtJP = k => { const d=parse(k); return `${d.getMonth()+1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`; };
const cycleDay = key => {
  const past = PERIODS.map(p=>p.start).filter(p => p <= key).sort();
  if(!past.length) return null;
  return Math.round((parse(key) - parse(past[past.length-1]))/86400000) + 1;
};
$('#todayLabel').textContent = fmtJP(TODAY);
const photoCount = l => l && l.photos ? Object.keys(l.photos).filter(k=>PHOTO_SETS.some(s=>k.startsWith(s.k+'_'))).length : 0;
const lastWeight = key => {
  const ks = Object.keys(LOGS).filter(k => k <= key && LOGS[k].weight != null).sort();
  return ks.length ? LOGS[ks[ks.length-1]].weight : null;
};

/* ============ 時刻の計算（就寝・起床・食事） ============ */
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };
const hm = m => { m = ((Math.round(m)%1440)+1440)%1440; return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`; };
// 0時をまたぐ時間（就寝 23:30 → 起床 7:00 など）を、日をまたいだ分数で数える
const spanMin = (a,b) => { if(!a || !b) return null; let d = toMin(b) - toMin(a); if(d <= 0) d += 1440; return d; };
const sleepHoursOf = (bed, wake) => { const d = spanMin(bed, wake); return d==null ? null : Math.round(d/6)/10; };
const durText = d => d==null ? '–' : `${Math.floor(d/60)}時間${d%60?d%60+'分':''}`;
// 16時間ダイエット：前日の最後の食事の終わり → 今日の最初の食事の始まり、が「食べていない時間」
const FAST_GOAL = 16*60;
const prevKey = k => { const d = parse(k); d.setDate(d.getDate()-1); return ymd(d); };
const fastOf = (key, l=LOGS[key]) => { const p = LOGS[prevKey(key)]; return (l && l.mealStart && p && p.mealEnd) ? spanMin(p.mealEnd, l.mealStart) : null; };
// ─── いいことをした日 ───
// 入力を増やさず、その日の記録から自動で数える。続いているかを見せるためのもの（肌スコアとの比較はしない）
const GOOD_THINGS = [
  {k:'vitc',    n:'ビタミンCサプリ',          test:(k,l)=> (l.supplements||[]).includes('vitc')},
  {k:'noAvoid', n:'控えたい食べ物なし',        test:(k,l)=> Array.isArray(l.avoidFoods) && l.avoidFoods.length===0},
  {k:'food7',   n:'10品目のうち7品目以上',     test:(k,l)=> (l.foods||[]).length>=7},
  {k:'fast16',  n:'16時間あけた',              test:(k,l)=> { const f = fastOf(k, l); return f!=null && f>=FAST_GOAL; }},
  {k:'water6',  n:'水を6杯以上',               test:(k,l)=> (l.water||0)>=6},
  {k:'sleep7',  n:'7時間以上ねた',             test:(k,l)=> l.sleepHours!=null && l.sleepHours>=7},
  {k:'move',    n:'運動した',                  test:(k,l)=> (l.lifeTags||[]).includes('運動した')},
];
const goodOf = (key, l=LOGS[key]) => l ? GOOD_THINGS.filter(g=>g.test(key,l)) : [];
// 今日（今日がまだできていなければ昨日）からさかのぼって、何日続いているか
function streakOf(g){
  let d = parse(TODAY), n = 0;
  if(!(LOGS[TODAY] && g.test(TODAY, LOGS[TODAY]))) d.setDate(d.getDate()-1);
  for(;;){ const k = ymd(d), l = LOGS[k]; if(!(l && g.test(k,l))) break; n++; d.setDate(d.getDate()-1); }
  return n;
}
// 夜の時刻を「0時以降も続き」として並べる（23:30 と 0:30 が近くなる）
const wrapNight = (m, limit=720) => m < limit ? m + 1440 : m;

/* ============ カレンダー ============ */
let curY = +TODAY.slice(0,4), curM = +TODAY.slice(5,7);   // 表示中の年月
function renderCal(){

  const nav = el('div','月nav');

  nav.append(prev, el('div','label num',`${curY}年 ${curM}月`), next);
  if(loadMeta().driveLinked && loadMeta().driveDirty){
    const d = el('button','backup-note','Drive への保存が止まっています。タップして再開 ›');

    v.append(d);
  }

  v.append(nav);

  const dow = el('div','dow');
  '日月火水木金土'.split('').forEach(d=> dow.append(el('div',null,d)));

  for(let i=0;i<first.getDay();i++) grid.append(el('div','cell empty'));

  let sum=0, n=0, sn=0, photos=0, goodDays=0;
  for(let d=1; d<=days; d++){
    const key = `${curY}-${String(curM).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const log = LOGS[key];
    const c = el('button','cell' + (log && log.score ? ` on${log.score}` : '') + (key===TODAY?' today':''));
    c.setAttribute('aria-label',
      `${curM}月${d}日${key===TODAY?'・今日':''}　${log?`${log.score?`肌の調子 ${log.score}／5`:'肌の調子は未記録'}${photoCount(log)?`・写真${photoCount(log)}枚`:''}`:'記録なし'}`);
    if(log && log.score) c.style.background = `var(--s${log.score})`;
    c.append(el('span','d num', String(d)));
    if(photoCount(log)){ photos++; c.append(el('span','photo')); }
    const gd = goodOf(key, log).length;
    if(gd){ goodDays++; c.append(el('span','good', '♥')); c.setAttribute('aria-label', c.getAttribute('aria-label') + `・いいこと${gd}つ`); }
    c.onclick = ()=> openLog(key);
    grid.append(c);
    if(log){ n++; if(log.score!=null){ sum += log.score; sn++; } }
  }
  v.append(grid);

  const lg = el('div','legend');
  lg.append(el('span',null,'肌の調子　わるい'));
  [1,2,3,4,5].forEach(s=>{ const i=el('i'); i.style.background=`var(--s${s})`; lg.append(i); });
  lg.append(el('span',null,'よい'));
  v.append(lg);

  // 続いていること（いいことの連続日数）。♥ はいいことを1つ以上した日
  {
    const rows = GOOD_THINGS.map(g=>({g, streak: streakOf(g)})).filter(x=>x.streak>0).sort((a,b)=>b.streak-a.streak);
    const card = el('div','card streaks');
    card.innerHTML = `<h3>続いていること</h3><p class="sub">記録から自動で数えています。カレンダーの <span class="good-mark">♥</span> は、いいことを1つ以上した日です</p>`;
    if(!rows.length) card.append(el('p','hint','ビタミンCサプリ・控えたい食べ物なし・7品目以上・16時間・水6杯・7時間睡眠・運動 のどれかを記録すると、ここに続いた日数が出ます'));
    rows.forEach(({g,streak})=> card.append(el('div','streak', `<span>${esc(g.n)}</span><b class="num">${streak}<small>日連続</small></b>`)));
    v.append(card);
  }

  const mLogs = Object.entries(LOGS).filter(([k])=>k.startsWith(`${curY}-${String(curM).padStart(2,'0')}`)).map(([,l])=>l);
  const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
  const avgSleep = mean(mLogs.map(l=>l.sleepHours).filter(h=>h!=null));
  const avgFood  = mean(mLogs.map(l=>l.foods.length));
  const weights  = mLogs.map(l=>l.weight).filter(w=>w!=null);
  const s = el('div','summary');
  s.append(
    el('div','stat',`<div class="k">平均スコア</div><div class="v num">${sn?(sum/sn).toFixed(1):'–'}<small>/ 5</small></div>`),
    el('div','stat',`<div class="k">記録した日</div><div class="v num">${n}<small>日</small></div>`),
    el('div','stat',`<div class="k">平均睡眠</div><div class="v num">${avgSleep?avgSleep.toFixed(1):'–'}<small>h</small></div>`),
    el('div','stat',`<div class="k">平均の品目数</div><div class="v num">${avgFood?avgFood.toFixed(1):'–'}<small>/ 10</small></div>`),
    el('div','stat',`<div class="k">体重</div><div class="v num">${weights.length?weights[weights.length-1].toFixed(1):'–'}<small>kg</small></div>`),
    el('div','stat',`<div class="k">平均の水分</div><div class="v num">${mean(mLogs.map(l=>l.water).filter(w=>w!=null))?.toFixed(1) ?? '–'}<small>杯</small></div>`),
    el('div','stat',`<div class="k">湯船に入った日</div><div class="v num">${mLogs.filter(l=>l.bath==='tub').length}<small>日</small></div>`),
    el('div','stat',`<div class="k">いいことをした日</div><div class="v num">${goodDays}<small>日</small></div>`),
    el('div','stat',`<div class="k">写真のある日</div><div class="v num">${photos}<small>日</small></div>`)
  );
  v.append(s);

  const cta = el('button','cta', LOGS[TODAY] ? '今日の記録を見直す' : '今日を記録する');
  cta.onclick = ()=> openLog(TODAY);
  v.append(cta);
}

/* ============ グラフ ============ */
let range = 30;
function renderGraph(){
  const v = $('#view-graph'); v.innerHTML='';

  const seg = el('div','seg');
  [[30,'1か月'],[90,'3か月']].forEach(([r,label])=>{
    const b = el('button',null,label);
    b.setAttribute('aria-pressed', r===range);
    b.onclick = ()=>{ range=r; renderGraph(); };
    seg.append(b);
  });
  v.append(seg);

  const keys=[]; const end=parse(TODAY);
  for(let i=range-1;i>=0;i--){ const d=new Date(end); d.setDate(d.getDate()-i); keys.push(ymd(d)); }

  const W=100, H=52, padL=7, padR=2, padT=4, padB=9;
  const x = i => padL + (W-padL-padR) * (i/(keys.length-1));
  const yS = s => padT + (H-padT-padB) * (1 - (s-1)/4);
  const ySleep = h => (H-padB) - (H-padT-padB) * Math.min(h,10)/10 * 0.55;

  let bands='', bars='', pts=[], dots='', grid='', labels='';
  // 生理の帯（開始日〜終了日。終了が未入力なら5日として描く）
  PERIODS.forEach(p=>{
    const i0 = keys.indexOf(p.start); if(i0<0) return;
    const iEnd = p.end ? keys.indexOf(p.end) : -1;
    const i1 = Math.min(iEnd >= 0 ? iEnd : i0+4, keys.length-1);
    bands += `<rect x="${x(i0)-0.4}" y="${padT}" width="${Math.max(x(i1)-x(i0)+0.8,1)}" height="${H-padT-padB}" fill="var(--period)" opacity=".75"/>`;
  });
  // 目盛り
  [1,2,3,4,5].forEach(s=>{
    grid += `<line x1="${padL}" y1="${yS(s)}" x2="${W-padR}" y2="${yS(s)}" stroke="var(--line)" stroke-width=".2"/>`;
    grid += `<text x="${padL-1.5}" y="${yS(s)+1}" font-size="2.6" fill="var(--text-weak)" text-anchor="end" font-family="Inter">${s}</text>`;
  });
  keys.forEach((k,i)=>{
    const log = LOGS[k];
    if(log){
      const bw = Math.max((W-padL-padR)/keys.length*0.55, 0.5);
      if(log.sleepHours!=null) bars += `<rect x="${x(i)-bw/2}" y="${ySleep(log.sleepHours)}" width="${bw}" height="${(H-padB)-ySleep(log.sleepHours)}" fill="var(--sleep)" rx=".3"/>`;
      if(log.score!=null){
        pts.push([x(i), yS(log.score)]);
        if(range===30) dots += `<circle cx="${x(i)}" cy="${yS(log.score)}" r=".9" fill="var(--accent)"/>`;
      }
    }
    const d = parse(k);
    if(d.getDate()===1 || i===keys.length-1)
      labels += `<text x="${x(i)}" y="${H-2}" font-size="2.6" fill="var(--text-weak)" text-anchor="${i===keys.length-1?'end':'middle'}" font-family="Inter">${d.getMonth()+1}/${d.getDate()}</text>`;
  });
  const line = pts.map((p,i)=> (i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');

  const card = el('div','card');
  card.innerHTML = `<h3>肌スコアと睡眠</h3><p class="sub">折れ線＝肌スコア／棒＝睡眠時間／帯＝生理期間</p>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:210px">
      ${bands}${grid}${bars}
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width=".8" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${labels}
    </svg>
    <div class="gkey">
      <span><i style="background:var(--accent)"></i>肌スコア</span>
      <span><i style="background:var(--sleep);height:8px;width:8px;border-radius:2px"></i>睡眠時間</span>
      <span><i style="background:var(--period);height:8px;width:8px;border-radius:2px"></i>生理期間</span>
    </div>`;
  v.append(card);

  // 時刻の折れ線（就寝・起床・食事）。上ほど早い時刻。同じ時刻に近いほど線が平らになる
  function timeChart(label, get, wrap){
    const pts = [];
    keys.forEach((k,i)=>{ const l = LOGS[k], t = l && get(l); if(t) pts.push([i, wrap(toMin(t))]); });
    if(!pts.length) return null;
    const vals = pts.map(p=>p[1]);
    const lo = Math.floor((Math.min(...vals)-20)/60)*60, hi = Math.max(Math.ceil((Math.max(...vals)+20)/60)*60, lo+120);
    const H4=30, pt=3, pb=3, y = m => pt + (H4-pt-pb) * ((m-lo)/(hi-lo));
    const step = (hi-lo) > 300 ? 120 : 60;
    let g = '';
    for(let m=lo; m<=hi; m+=step){
      g += `<line x1="${padL}" y1="${y(m)}" x2="${W-padR}" y2="${y(m)}" stroke="var(--line)" stroke-width=".2"/>`;
      g += `<text x="${padL-1.5}" y="${y(m)+1}" font-size="2" fill="var(--text-weak)" text-anchor="end" font-family="Inter">${hm(m)}</text>`;
    }
    const path = pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(2)+' '+y(p[1]).toFixed(2)).join(' ');
    const dots = pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r=".9" fill="var(--accent)"/>`).join('');
    const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
    const sd = Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/vals.length);
    return {mean, sd, n:vals.length, html:`<div class="tc-head"><b>${label}</b><span class="num">平均 ${hm(mean)}　ばらつき ±${Math.round(sd)}分</span></div>
      <svg viewBox="0 0 ${W} ${H4}" preserveAspectRatio="none" style="height:96px">${g}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width=".6" stroke-linejoin="round"/>${dots}</svg>`};
  }
  const bedC = timeChart('寝た時刻', l=>l.bedTime, m=>wrapNight(m));
  const wakeC = timeChart('起きた時刻', l=>l.wakeTime, m=>m);
  if(bedC || wakeC){
    const cR = el('div','card');
    cR.innerHTML = `<h3>寝る・起きる時刻</h3><p class="sub">線が平らなほど、同じ時刻に寝起きできています。ばらつきは小さいほどそろっています</p>${[bedC,wakeC].filter(Boolean).map(c=>c.html).join('')}`;
    v.append(cR);
  }

  // 体重と食事品目数（肌スコアとは単位が違うので別のカードにする）
  const wPts = [], fBars = [];
  const ws = keys.map(k=>LOGS[k]?.weight).filter(w=>w!=null);
  if(ws.length){
    const wMin = Math.floor(Math.min(...ws)*2)/2 - 0.5, wMax = Math.ceil(Math.max(...ws)*2)/2 + 0.5;
    const H2=34, padT2=4, padB2=8;
    const yW = w => padT2 + (H2-padT2-padB2) * (1 - (w-wMin)/(wMax-wMin));
    keys.forEach((k,i)=>{ const w = LOGS[k]?.weight; if(w!=null) wPts.push([x(i), yW(w)]); });
    const wLine = wPts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');
    let wGrid='';
    [wMin, (wMin+wMax)/2, wMax].forEach(w=>{
      wGrid += `<line x1="${padL}" y1="${yW(w)}" x2="${W-padR}" y2="${yW(w)}" stroke="var(--line)" stroke-width=".2"/>`;
      wGrid += `<text x="${padL-1.5}" y="${yW(w)+1}" font-size="2.4" fill="var(--text-weak)" text-anchor="end" font-family="Inter">${w.toFixed(1)}</text>`;
    });
    const cW = el('div','card');
    cW.innerHTML = `<h3>体重</h3><p class="sub">記録のある日だけをつないでいます（kg）</p>
      <svg viewBox="0 0 ${W} ${H2}" preserveAspectRatio="none" style="height:120px">${wGrid}
        <path d="${wLine}" fill="none" stroke="var(--text-sub)" stroke-width=".7" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>`;
    v.append(cW);
  }
  {
    const H3=28, padT3=3, padB3=6;
    const yF = n => padT3 + (H3-padT3-padB3) * (1 - n/10);
    let g='', bw = Math.max((W-padL-padR)/keys.length*0.6, 0.5);
    [0,5,10].forEach(n=>{
      g += `<line x1="${padL}" y1="${yF(n)}" x2="${W-padR}" y2="${yF(n)}" stroke="var(--line)" stroke-width=".2"/>`;
      g += `<text x="${padL-1.5}" y="${yF(n)+1}" font-size="2.4" fill="var(--text-weak)" text-anchor="end" font-family="Inter">${n}</text>`;
    });
    keys.forEach((k,i)=>{ const l=LOGS[k]; if(!l) return;
      const c = l.foods.length>=7 ? 'var(--accent)' : 'var(--s2)';
      g += `<rect x="${x(i)-bw/2}" y="${yF(l.foods.length)}" width="${bw}" height="${yF(0)-yF(l.foods.length)}" fill="${c}" rx=".3"/>`;
    });
    const cF = el('div','card');
    cF.innerHTML = `<h3>食事の品目数</h3><p class="sub">10品目のうちいくつ取れたか。7品目以上は濃い色</p>
      <svg viewBox="0 0 ${W} ${H3}" preserveAspectRatio="none" style="height:100px">${g}</svg>`;
    v.append(cF);
  }

  // 食べていない時間（16時間ダイエット）
  {
    const fs = keys.map(k=>[k, fastOf(k)]).filter(([,f])=>f!=null);
    if(fs.length){
      const H3=30, pt3=3, pb3=6, top=24*60, yF = m => pt3 + (H3-pt3-pb3) * (1 - m/top);
      const bw = Math.max((W-padL-padR)/keys.length*0.6, 0.5);
      let g = '';
      [0,8,16,24].forEach(h=>{
        g += `<line x1="${padL}" y1="${yF(h*60)}" x2="${W-padR}" y2="${yF(h*60)}" stroke="${h===16?'var(--accent)':'var(--line)'}" stroke-width=".2"${h===16?' stroke-dasharray="1 .8"':''}/>`;
        g += `<text x="${padL-1.5}" y="${yF(h*60)+1}" font-size="2.2" fill="var(--text-weak)" text-anchor="end" font-family="Inter">${h}</text>`;
      });
      keys.forEach((k,i)=>{ const f = fastOf(k); if(f==null) return;
        g += `<rect x="${x(i)-bw/2}" y="${yF(f)}" width="${bw}" height="${yF(0)-yF(f)}" fill="${f>=FAST_GOAL?'var(--accent)':'var(--s2)'}" rx=".3"/>`; });
      const ok = fs.filter(([,f])=>f>=FAST_GOAL).length, mean = fs.reduce((a,[,f])=>a+f,0)/fs.length;
      const cM = el('div','card');
      cM.innerHTML = `<h3>食べていない時間</h3><p class="sub">前日の食べ終わり〜今日の食べ始め。点線＝16時間、濃い棒＝16時間以上</p>
        <div class="tc-head"><b>16時間以上 ${ok}日 / ${fs.length}日</b><span class="num">平均 ${durText(Math.round(mean))}</span></div>
        <svg viewBox="0 0 ${W} ${H3}" preserveAspectRatio="none" style="height:100px">${g}</svg>`;
      v.append(cM);
    }
  }

  // ざっくりの気づき
  const withLog = keys.map(k=>LOGS[k]).filter(Boolean);
  const good = withLog.filter(l=>l.sleepHours!=null && l.sleepHours>=7), bad = withLog.filter(l=>l.sleepHours!=null && l.sleepHours<6);
  // スコアを入れなかった日は平均に混ぜない
  const avg = a => { const w = a.filter(l=>l.score!=null); return w.length ? (w.reduce((s,l)=>s+l.score,0)/w.length).toFixed(1) : '–'; };
  const bedMin = l => wrapNight(toMin(l.bedTime));
  const nearBed = bedC ? withLog.filter(l=>l.bedTime && Math.abs(bedMin(l)-bedC.mean)<=30) : [];
  const farBed  = bedC ? withLog.filter(l=>l.bedTime && Math.abs(bedMin(l)-bedC.mean)>30) : [];
  const fastOk = keys.filter(k=>LOGS[k] && fastOf(k)!=null && fastOf(k)>=FAST_GOAL).map(k=>LOGS[k]);
  const fastNo = keys.filter(k=>LOGS[k] && fastOf(k)!=null && fastOf(k)<FAST_GOAL).map(k=>LOGS[k]);
  const c2 = el('div','card');
  c2.innerHTML = `<h3>この期間の内訳</h3>
    <div class="item"><div class="name"><b>7時間以上ねた日</b><span class="num">${good.length}日</span></div><div class="avg num">${avg(good)}</div></div>
    <div class="item"><div class="name"><b>6時間未満だった日</b><span class="num">${bad.length}日</span></div><div class="avg num">${avg(bad)}</div></div>
    <div class="item"><div class="name"><b>7品目以上とれた日</b><span class="num">${withLog.filter(l=>l.foods.length>=7).length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.foods.length>=7))}</div></div>
    <div class="item"><div class="name"><b>4品目以下だった日</b><span class="num">${withLog.filter(l=>l.foods.length<=4).length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.foods.length<=4))}</div></div>
    ${bedC && bedC.n>=4 ? `<div class="item"><div class="name"><b>寝た時刻が平均の前後30分以内だった日</b><span class="num">${nearBed.length}日</span></div><div class="avg num">${avg(nearBed)}</div></div>
    <div class="item"><div class="name"><b>寝た時刻が平均から30分より外れた日</b><span class="num">${farBed.length}日</span></div><div class="avg num">${avg(farBed)}</div></div>` : ''}
    ${fastOk.length+fastNo.length>=4 ? `<div class="item"><div class="name"><b>16時間以上食べなかった日</b><span class="num">${fastOk.length}日</span></div><div class="avg num">${avg(fastOk)}</div></div>
    <div class="item"><div class="name"><b>16時間に届かなかった日</b><span class="num">${fastNo.length}日</span></div><div class="avg num">${avg(fastNo)}</div></div>` : ''}
    <div class="item"><div class="name"><b>水を6杯以上のんだ日</b><span class="num">${withLog.filter(l=>l.water>=6).length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.water>=6))}</div></div>
    <div class="item"><div class="name"><b>お通じがなかった日</b><span class="num">${withLog.filter(l=>l.poop==='no').length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.poop==='no'))}</div></div>
    <div class="item"><div class="name"><b>メイクをした日</b><span class="num">${withLog.filter(l=>l.makeup==='yes').length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.makeup==='yes'))}</div></div>
    <div class="item"><div class="name"><b>メイクをしなかった日</b><span class="num">${withLog.filter(l=>l.makeup==='no').length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.makeup==='no'))}</div></div>
    <div class="item"><div class="name"><b>湯船に入った日</b><span class="num">${withLog.filter(l=>l.bath==='tub').length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.bath==='tub'))}</div></div>
    <div class="item"><div class="name"><b>飲酒した日</b><span class="num">${withLog.filter(l=>l.lifeTags.includes('飲酒')).length}日</span></div><div class="avg num">${avg(withLog.filter(l=>l.lifeTags.includes('飲酒')))}</div></div>`;
  v.append(c2);
}

/* ============ アイテム ============ */
function itemStats(id){
  const used = Object.values(LOGS).filter(l=>l.itemIds.includes(id));
  const w = used.filter(l=>l.score!=null);
  return {days: used.length, avg: w.length ? w.reduce((s,l)=>s+l.score,0)/w.length : null};
}
function renderItems(){
  const v = $('#view-items'); v.innerHTML='';

  if(photoAuthNeeded){
    const nb = el('button','backup-note','Drive の写真を表示するには、タップしてログインしてください ›');
    nb.onclick = async ()=>{ try{ await gAuth(); photoAuthNeeded = false; renderAll(); }catch(e){ toast('ログインできませんでした'); } };
    v.append(nb);
  }

  /* --- いまの肌におすすめの成分 --- */
  // 直近14日の状態タグを数えて、多い悩みの上位3つを出す
  const recent = [];
  const end = parse(TODAY);
  for(let i=0;i<14;i++){ const d=new Date(end); d.setDate(d.getDate()-i); const l=LOGS[ymd(d)]; if(l) recent.push(l); }
  const count = {};
  recent.forEach(l => l.conditions.forEach(c => count[c] = (count[c]||0)+1));
  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).filter(([,n])=>n>=2).slice(0,3);

  const rec = el('div','card');
  rec.innerHTML = `<h3>いまの肌におすすめの成分</h3><p class="sub">直近14日でよく出ている状態から出しています</p>`;
  if(!top.length){
    rec.append(el('p','hint','この2週間は状態タグがあまり付いていません。気になることが出たら記録してください'));
  } else {
    // 先に「控えめにしたい」成分を決めて、おすすめ側からは外す（同じ成分が両方に出ないようにする）
    const irritated = top.map(([c])=>c).filter(c => ['赤み','かゆみ','乾燥'].includes(c));
    const avoidList = irritated.length ? INGREDIENTS.filter(g => g.avoid && g.avoid.some(c=>irritated.includes(c))) : [];
    top.forEach(([cond, n])=>{
      const block = el('div','rec');
      block.append(el('div','rec-head', `<b>${esc(cond)}</b><span class="num">14日中 ${n}日</span>`));
      const chips = el('div','chips');
      INGREDIENTS.filter(g => g.for.includes(cond) && !avoidList.includes(g)).forEach(g=>{
        const have = ITEMS.filter(it => it.active && it.ingredients.includes(g.k));
        const c = el('div','chip ing' + (have.length?' have':''));
        c.innerHTML = `${ingIcon(g)}${esc(g.n)}${have.length?`<em>${have.length===1?esc(have[0].name):'持っている '+have.length+'点'}</em>`:'<em>持っていない</em>'}`;
        chips.append(c);
      });
      block.append(chips);
      rec.append(block);
    });
    // 荒れているときに控えたい成分
    if(irritated.length){
      const av = avoidList;
      const have = av.filter(g => ITEMS.some(it => it.active && it.ingredients.includes(g.k)));
      const block = el('div','rec warn');
      block.append(el('div','rec-head', `<b>いまは控えめにしたい</b><span>${esc(irritated.join('・'))}が出ているため</span>`));
      const chips = el('div','chips');
      av.forEach(g=>{
        const mine = have.includes(g);
        const c = el('div','chip ing off');
        c.innerHTML = `${ingIcon(g)}${esc(g.n)}${mine?'<em>持っている</em>':''}`;
        chips.append(c);
      });
      block.append(chips);
      rec.append(block);
    }
  }
  rec.append(el('p','hint','一般的な目安です。ひどい荒れ・痛み・長引く不調があるときは皮膚科で診てもらってください'));
  v.append(rec);

  /* --- 目的から探す（★主要成分の効果ジャンルでまとめる） --- */
  {
    const gc = el('div','card');
    gc.innerHTML = `<h3>目的から探す</h3><p class="sub">使っているアイテムを、★（主要成分）の効果ジャンルごとに並べています。タップで編集</p>`;
    const act = ITEMS.filter(it=>it.active);
    const keysOf = it => (it.keyIngredients||[]).filter(k=>it.ingredients.includes(k));
    INGREDIENT_GROUPS.forEach(gr=>{
      const members = INGREDIENTS.filter(g=> gr.k==='その他' ? !(g.genres||[]).length : (g.genres||[]).includes(gr.k));
      if(!members.length) return;
      // ★がついている成分のジャンルにだけ出す（☑だけの成分では出さない）
      const hits = act.map(it=>({it, hit: members.filter(g=>keysOf(it).includes(g.k))})).filter(h=>h.hit.length);
      if(gr.k==='その他' && !hits.length) return;
      const b = el('div','goal');
      b.append(el('div','goal-head', `<b>${iconTag(gr.icon)}${esc(gr.k)}</b><span>${esc(members.map(g=>g.n).join('・'))}</span>`));
      if(!hits.length) b.append(el('div','goal-none','このジャンルの成分が★（主要成分）のアイテムはありません'));
      hits.forEach(({it,hit})=>{
        const row = el('button','goal-item', `<b>${esc(it.name)}</b><span>${hit.map(g=>'<i class="key" aria-label="主要成分">★</i>'+esc(g.n)).join('・')}</span>`);
        row.onclick = ()=> openItem(it.id);
        b.append(row);
      });
      gc.append(b);
    });
    // ★がまだないアイテムは、どのジャンルにも出ないので、ここで知らせる
    const noKey = act.filter(it=>!keysOf(it).length);
    if(noKey.length){
      const b = el('div','goal');
      b.append(el('div','goal-head', `<b>★がまだないアイテム</b><span>タップして、主要成分に★をつけてください</span>`));
      noKey.forEach(it=>{ const row = el('button','goal-item', `<b>${esc(it.name)}</b><span>★をつける</span>`); row.onclick = ()=> openItem(it.id); b.append(row); });
      gc.append(b);
    }
    v.append(gc);
  }


  /* --- アイテム別の平均スコア --- */
  const card = el('div','card');
  card.innerHTML = `<h3>使った日の平均スコア</h3><p class="sub">記録がある日のうち、そのアイテムを使った日の平均です</p>`;
  ITEMS.slice().sort((a,b)=>(b.active-a.active) || (itemStats(b.id).avg||0)-(itemStats(a.id).avg||0)).forEach(it=>{
    const st = itemStats(it.id);
    const row = el('button','item'+(it.active?'':' off'));
    row.innerHTML = `<span class="thumb-slot"></span><div class="name"><b>${esc(it.name)}</b><span>${esc(it.category)}${it.active?'':'・使っていない'}　<span class="num">${st.days}</span>日</span>
        <span class="ings">${it.ingredients.length ? [...it.ingredients].sort((a,b)=>(it.keyIngredients||[]).includes(b)-(it.keyIngredients||[]).includes(a)).map(k=>{ const g = INGREDIENTS.find(x=>x.k===k); const key = (it.keyIngredients||[]).includes(k) ? '<i class="key" aria-label="主要成分">★</i>' : ''; return g ? `<span class="ig">${key}${ingIcon(g)}${esc(g.n)}</span>` : esc(k); }).join(' ') : '成分は未登録'}</span></div>
      <div class="bar"><i style="width:${st.avg?((st.avg-1)/4*100):0}%"></i></div>
      <div class="avg num">${st.avg?st.avg.toFixed(1):'–'}</div>`;
    if(it.photo){ const im = el('img','thumb'); im.alt=''; row.querySelector('.thumb-slot').replaceWith(im); fillImg(im, it.photo); }
    else row.querySelector('.thumb-slot').className = 'thumb';
    row.onclick = ()=> openItem(it.id);
    card.append(row);
  });
  v.append(card);

  /* --- 成分別の平均スコア --- */
  const ic = el('div','card');
  ic.innerHTML = `<h3>成分別の平均スコア</h3><p class="sub">その成分が入ったアイテムを使った日の平均です</p>`;
  const rows = INGREDIENTS.map(g=>{
    const ids = ITEMS.filter(it=>it.ingredients.includes(g.k)).map(it=>it.id);
    if(!ids.length) return null;
    const used = Object.values(LOGS).filter(l => l.itemIds.some(id=>ids.includes(id)));
    const w = used.filter(l=>l.score!=null);
    if(!w.length) return null;
    return {g, days:used.length, avg: w.reduce((s,l)=>s+l.score,0)/w.length};
  }).filter(Boolean).sort((a,b)=>b.avg-a.avg);
  if(!rows.length) ic.append(el('p','hint','アイテムに成分を登録すると、ここに出ます'));
  rows.forEach(r=>{
    const row = el('div','item');
    row.innerHTML = `<div class="name"><b>${ingIcon(r.g)}${esc(r.g.n)}</b><span>${r.g.purpose ? esc(r.g.purpose)+'　' : ''}<span class="num">${r.days}</span>日</span></div>
      <div class="bar"><i style="width:${(r.avg-1)/4*100}%"></i></div>
      <div class="avg num">${r.avg.toFixed(1)}</div>`;
    ic.append(row);
  });
  v.append(ic);

  const add = el('button','add','＋ アイテムを追加');
  add.onclick = ()=> openItem(null);
  v.append(add);
}

// 種類のことば。「UVミルク」「日焼け止めクリーム」を乳液・クリームより先に日焼け止めとして、「クレンジングフォーム」を洗顔より先にクレンジングとして拾うため、日焼け止め・クレンジングを前に置く
// 種類は、使う順番で並べる（アイテム登録の種類ボタンも、記録シートのグループもこの順）
const CATEGORIES = ['クレンジング','洗顔','導入化粧水','化粧水','パック','美容液','乳液','クリーム','日焼け止め'];
const CAT_WORDS = [['日焼け止め',['日焼け止め','サンスクリーン','UV','SPF']],['クレンジング',['クレンジング','メイク落とし']],['導入化粧水',['導入','ブースター','先行美容液','プレ化粧水']],['化粧水',['化粧水','ローション']],['乳液',['乳液','ミルク']],['美容液',['美容液','セラム','エッセンス']],
  ['クリーム',['クリーム']],['パック',['パック','マスク']],['洗顔',['洗顔','フォーム']]];
const detectCategory = name => { const t = name.normalize('NFKC').toUpperCase(); const h = CAT_WORDS.find(([,w])=>w.some(x=>t.includes(x))); return h ? h[0] : ''; };
// 成分表の書き方のゆれ（別名）。BHA・AHAは防腐剤などと紛らわしいので日本語名だけで見る
// 成分表（全成分表示）を1成分ずつに切る。「有効成分：」「その他の成分：」などの見出しも区切りとして扱う
function splitInci(text){
  return String(text).normalize('NFKC')
    .replace(/[<\[【(]?(有効成分|その他の成分|その他成分|表示成分|全成分表示|全成分|成分)[>\]】)]?\s*[:：]?/g, '、')
    .split(/[、,;\n\r\t／/]+/).map(normIng).filter(Boolean);
}
// 成分表から、入っている成分（☑）のキーを返す。1成分ずつ名前で照合し、部分一致はしない
function matchIngredients(text){
  const toks = splitInci(text);
  return INGREDIENTS.filter(g=>{
    const m = BUILTIN_MATCH[g.k] || exact(g.n);   // 自分で足した成分は名前そのもので照合
    return toks.some(t => m(t));
  }).map(g=>g.k);
}

async function saveItem(){
  if(!itemDraft.name.trim()){ toast('名前を入れてください'); return; }
  try{ await commitPhotos(itemPend); }catch(e){ toast('写真を保存できませんでした'); return; }
  itemPend = {};
  const i = ITEMS.findIndex(x=>x.id===itemDraft.id);
  if(i<0) ITEMS.push(itemDraft); else ITEMS[i] = itemDraft;
  if(!save()) return;
  closeSheets(); renderAll(); toast('保存しました');
}

// スキンケアの順番。記録シートでは、この順に種類ごとにまとめて出す（一覧にない種類は最後、種類なしは「その他」）
const ROUTINE_ORDER = CATEGORIES;
function routineGroups(items){
  const map = new Map();
  items.forEach(it=>{ const c = it.category || 'その他'; if(!map.has(c)) map.set(c, []); map.get(c).push(it); });
  const rank = c => { const i = ROUTINE_ORDER.indexOf(c); return i < 0 ? (c === 'その他' ? 99 : 50) : i; };
  return [...map.entries()].sort((a,b)=> rank(a[0]) - rank(b[0]));
}

/* ============ 写真（IndexedDB） ============ */
let _pdb = null;
const pdb = () => _pdb || (_pdb = new Promise((res,rej)=>{
  const q = indexedDB.open('skincare_photos', 1);
  q.onupgradeneeded = ()=> q.result.createObjectStore('photos', {keyPath:'id'});
  q.onsuccess = ()=> res(q.result);
  q.onerror = ()=> { _pdb = null; rej(q.error); };
}));
async function ptx(mode, fn){
  const d = await pdb();
  return new Promise((res,rej)=>{
    const t = d.transaction('photos', mode), rq = fn(t.objectStore('photos'));
    t.oncomplete = ()=> res(rq && rq.result);
    t.onerror = t.onabort = ()=> rej(t.error);
  });
}
const putPhoto = (id, blob) => ptx('readwrite', st => st.put({id, blob}));
const delPhoto = id => ptx('readwrite', st => st.delete(id));
const getPhoto = async id => { const x = await ptx('readonly', st => st.get(id)); return x ? x.blob : null; };
// 長辺800px・JPEG品質0.7に縮める
async function shrink(file){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
  const k = Math.min(1, 800/Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res,rej)=> c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.7));
}
const pickImage = () => new Promise(res=>{
  const i = document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange = ()=> res(i.files[0] || null); i.oncancel = ()=> res(null); i.click();
});

function queuePhoto(add, drop, id){

// 戻り値: {blob}（撮影・縮小ずみ）／{file}（写真から選んだ元画像）／null（キャンセル）
function takeFacePhoto(title, hint){
  return new Promise(resolve=>{
    const ov = el('div','cam');
    ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','顔写真の撮影');
    ov.innerHTML = `<video playsinline muted autoplay></video><div class="cam-guide"><i></i></div>
      <div class="cam-top"><b>${title}</b><span>${hint}</span></div><div class="cam-msg" hidden></div>
      <div class="cam-bar"><button class="cam-x">キャンセル</button><button class="cam-shot" aria-label="撮影する" disabled></button><button class="cam-pick">写真から選ぶ</button></div>`;
    document.body.append(ov);
    const v = ov.querySelector('video'), shot = ov.querySelector('.cam-shot'), msg = ov.querySelector('.cam-msg');
    let stream = null;
    const done = r => { if(stream) stream.getTracks().forEach(t=>t.stop()); ov.remove(); resolve(r); };
    ov.querySelector('.cam-x').onclick = ()=> done(null);
    ov.querySelector('.cam-pick').onclick = async ()=>{ const f = await pickImage(); if(f) done({file:f}); };
    shot.onclick = ()=>{
      const vw = v.videoWidth, vh = v.videoHeight; if(!vw) return;
      // 画面に見えている範囲（枠との位置関係）をそのまま残す。鏡ではなく、ふつうの写真の向きで保存する
      const rc = v.getBoundingClientRect(), k = Math.max(rc.width/vw, rc.height/vh);
      const sw = rc.width/k, sh = rc.height/k, sx = (vw-sw)/2, sy = (vh-sh)/2, sc = Math.min(1, 800/Math.max(sw,sh));
      const c = document.createElement('canvas'); c.width = Math.round(sw*sc); c.height = Math.round(sh*sc);
      c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);
      c.toBlob(b => b ? done({blob:b}) : toast('撮影できませんでした'), 'image/jpeg', 0.7);
    };
    (navigator.mediaDevices?.getUserMedia
      ? navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:1280}, height:{ideal:1280}}, audio:false})
      : Promise.reject(new Error('no camera')))
      .then(st=>{ stream = st; v.srcObject = st; return v.play().catch(()=>{}); })
      .then(()=>{ shot.disabled = false; })
      .catch(()=>{ msg.hidden = false; msg.textContent = 'カメラを使えませんでした。ブラウザのカメラの許可を確認するか、「写真から選ぶ」を使ってください'; });
  });
}

    });
    gPending = {res,rej};
    gClient.requestAccessToken({prompt:''});
  });
}
async function gFetch(url, opt={}){
  const r = await fetch(url, {...opt, headers:{...(opt.headers||{}), Authorization:'Bearer '+gToken}});
  if(r.status===401){ gToken = null; try{ sessionStorage.removeItem('skincare_gtok'); }catch(_){} throw new Error('ログインの期限切れ'); }
  if(!r.ok) throw new Error('Drive '+r.status);
  return r;
}
async function driveFind(){
  const q = encodeURIComponent(`name='${DRIVE_FILE}'`);
  const r = await gFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
  const f = (await r.json()).files || [];
  return f[0] || null;
}

const DRIVE_API = 'https://www.googleapis.com/drive/v3/files', DRIVE_UP = 'https://www.googleapis.com/upload/drive/v3/files';
const photoIds = (data=DB) => {
  const ids = new Set();
  Object.values(data.logs).forEach(l=> Object.values(l.photos||{}).forEach(x=> ids.add(x)));
  data.items.forEach(i=> i.photo && ids.add(i.photo));
  return [...ids];
};
async function driveList(){
  let out = [], tok = '';
  do{
    const j = await (await gFetch(`${DRIVE_API}?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)${tok?'&pageToken='+tok:''}`)).json();
    out = out.concat(j.files||[]); tok = j.nextPageToken||'';
  }while(tok);
  return new Map(out.map(f=>[f.name, f.id]));
}
async function drivePutPhoto(name, blob, fileId){
  if(fileId) return gFetch(`${DRIVE_UP}/${fileId}?uploadType=media`, {method:'PATCH', headers:{'Content-Type':'image/jpeg'}, body:blob});
  const b = '----skp' + Date.now();
  const head = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name, parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: image/jpeg\r\n\r\n`;
  return gFetch(`${DRIVE_UP}?uploadType=multipart`, {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:new Blob([head, blob, `\r\n--${b}--`])});
}
// 端末の写真を Drive へ。Drive にない写真と、差し替えた写真を送り、外した写真を Drive からも消す
async function drivePhotos(){
  const m = loadMeta(); if(m.noPhotoSync) return;
  const files = await driveList(), put = new Set(m.photoPut||[]);
  for(const id of (m.photoDel||[])){ const fid = files.get(id+'.jpg'); if(fid) await gFetch(`${DRIVE_API}/${fid}`, {method:'DELETE'}); }
  const todo = photoIds().filter(id => put.has(id) || !files.has(id+'.jpg'));
  let n = 0, failed = false;
  await pool(todo, FETCH_PARALLEL, async id=>{
    const blob = await getPhoto(id); if(!blob) return;   // JSON読み込みで来た記録など、実物がないものは飛ばす
    try{ await drivePutPhoto(id+'.jpg', blob, files.get(id+'.jpg')); }catch(e){ failed = true; throw e; }
    toast(`写真を送信中 ${++n}/${todo.length}`);
  });
  _dmap = null;
  if(failed) throw new Error('写真を送れませんでした');
  upMeta({photoPut:[], photoDel:[]});
}
// 同時に走らせる数を絞って処理する（Drive への通信が1枚ずつだと遅いため、4枚ずつ並べる）
const FETCH_PARALLEL = 4;
function pool(items, n, fn){
  return new Promise(res=>{
    let i = 0, active = 0, done = 0;
    if(!items.length) return res();
    const next = ()=>{
      while(active < n && i < items.length){
        const it = items[i++]; active++;
        Promise.resolve().then(()=>fn(it)).catch(()=>{}).finally(()=>{ active--; if(++done === items.length) res(); else next(); });
      }
    };
    next();
  });
}
let _dmap = null;                                   // Drive にある写真の一覧（名前→id）。開いている間だけ覚える
const driveMap = () => _dmap || (_dmap = driveList().catch(e=>{ _dmap = null; throw e; }));
const _inflight = new Map(); let _act = 0; const _wait = [];
const slot = async fn => { if(_act >= FETCH_PARALLEL) await new Promise(r=>_wait.push(r)); _act++; try{ return await fn(); } finally{ _act--; const r = _wait.shift(); if(r) r(); } };
// 1枚を Drive から取って端末に残す。戻り値: Blob（取れた）／'off'（連携なし・オフ）／'auth'（ログイン切れ）／'none'（Driveにない）／'error'
function driveGetPhoto(id){
  if(_inflight.has(id)) return _inflight.get(id);
  const m = loadMeta();
  if(!m.driveLinked || m.noPhotoSync) return Promise.resolve('off');
  if(!gValid()) return Promise.resolve('auth');
  const p = (async ()=>{
    try{
      const fid = (await driveMap()).get(id+'.jpg'); if(!fid) return 'none';
      const blob = await slot(async ()=> (await gFetch(`${DRIVE_API}/${fid}?alt=media`)).blob());
      await putPhoto(id, blob); return blob;
    }catch(e){ return 'error'; }
  })().finally(()=> _inflight.delete(id));
  _inflight.set(id, p); return p;
}
// 端末にない写真を、Drive からすべて取る（設定のボタン用）
async function driveFetchAllPhotos(){
  _dmap = null;
  const files = await driveMap(), need = [];
  for(const id of photoIds()) if(files.has(id+'.jpg') && !(await getPhoto(id))) need.push(id);
  if(!need.length){ toast('端末にない写真はありません'); return; }
  let n = 0, fail = 0;
  await pool(need, FETCH_PARALLEL, async id=>{
    const r = await driveGetPhoto(id);
    if(!(r instanceof Blob)) fail++;
    toast(`写真を取得中 ${++n}/${need.length}`);
  });
  toast(fail ? `${need.length-fail}枚を取得しました（${fail}枚は取れませんでした）` : `${need.length}枚を取得しました`);
}
async function driveUpload(){
  const body = JSON.stringify(DB), f = await driveFind();
  if(f) await gFetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,
                     {method:'PATCH', headers:{'Content-Type':'application/json'}, body});
  else {
    const b = '----skl' + Date.now();
    const mp = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:DRIVE_FILE, parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    await gFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',
                 {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+b}, body:mp});
  }
  await drivePhotos();
  upMeta({driveLinked:true, driveDirty:false, lastDrive:TODAY});
  showDriveStatus();
}
// 保存のたびに呼ばれる。ログインが切れていたら「未保存」の印だけ残す
function driveSoon(){
  if(!loadMeta().driveLinked) return;
  if(!gValid()){ upMeta({driveDirty:true}); return; }
  clearTimeout(gTimer);
  gTimer = setTimeout(()=> driveUpload().catch(()=>{ upMeta({driveDirty:true}); renderCal(); }), 1500);
}
// Drive を置きかえる前の門番。端末側が壊れている／空のときに、Drive の記録を失わないようにする
function driveGuard(){
  if(loadFailed){ toast('読み込みに失敗したので、Drive への保存を止めています'); return false; }
  const n = Object.keys(LOGS).length;
  if(!n) return confirm('この端末には記録がありません。Drive にある記録を消してよいですか？');
  return true;
}
async function driveResume(){
  if(!driveGuard()) return;
  const n = Object.keys(LOGS).length;
  if(!confirm(`Drive にある記録を、この端末の${n}日分で置きかえます。よいですか？`)) return;
  try{ await gAuth(); await driveUpload(); renderCal(); toast('Drive に保存しました'); }
  catch(e){ toast('Drive に保存できませんでした：'+e.message); }
}
function showDriveStatus(){
  const m = loadMeta();
  $('#drivePhotoState').textContent = m.noPhotoSync ? 'オフ' : 'オン';
  $('#driveStatus').textContent = !m.driveLinked ? '未連携' : m.driveDirty ? '未保存あり' : '最終 '+fmtJP(m.lastDrive).replace(/\(.\)/,'');
}
$('#btnDrivePhotos').onclick = ()=>{
  const off = !loadMeta().noPhotoSync;
  if(off && !confirm('写真を Drive に送らなくします。すでに Drive にある写真はそのまま残ります。よいですか？')) return;
  upMeta({noPhotoSync:off}); showDriveStatus();
  toast(off ? '写真は端末の中だけに残します' : '写真も Drive に送ります（次の保存から）');
};
$('#btnDriveAllPhotos').onclick = async ()=>{
  try{ await gAuth(); await driveFetchAllPhotos(); }
  catch(e){ toast('取得できませんでした：'+e.message); }
};
$('#btnDriveSave').onclick = async ()=>{
  if(!driveGuard()) return;
  try{
    await gAuth();
    const f = await driveFind();
    if(f){
      // 置きかえる前に、Drive 側と端末側の日数を並べて見せる
      let dn = null;
      try{ const d = await (await gFetch(`${DRIVE_API}/${f.id}?alt=media`)).json(); if(d && d.logs && typeof d.logs === 'object') dn = Object.keys(d.logs).length; }catch(_){}
      const mine = Object.keys(LOGS).length;
      if(!confirm(`Drive の${dn==null?'':dn+'日分の'}記録を、この端末の${mine}日分で置きかえます。よいですか？`)) return;
    }
    await driveUpload(); renderCal(); toast('Drive に保存しました');
  }catch(e){ toast('Drive に保存できませんでした：'+e.message); }
};
$('#btnDriveRestore').onclick = async ()=>{
  try{
    await gAuth();
    const f = await driveFind();
    if(!f){ toast('Drive にまだ記録がありません'); return; }
    const d = await (await gFetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();
    if(!d || typeof d.logs !== 'object' || !Array.isArray(d.items)){ toast('Drive のファイルを読めませんでした'); return; }
    if(!confirm(`Drive の${Object.keys(d.logs).length}日分の記録に置きかえます。いまの記録は消えます。よいですか？`)) return;
    const m2 = migrate(d);
    localStorage.setItem(STORE_KEY, JSON.stringify(m2));
    upMeta({driveLinked:true, driveDirty:false, lastDrive:TODAY, photoPut:[], photoDel:[]});
    toast('記録を復元しました。写真は表示するときに取得します');
    setTimeout(()=>location.reload(), 600);
  }catch(e){ toast('復元できませんでした：'+e.message); }
};
showDriveStatus();

/* ============ タブ ============ */

  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));

    renderAll();
    window.scrollTo(0, 0);   // 前の画面のスクロール位置を引きずらない
  };

renderAll();
